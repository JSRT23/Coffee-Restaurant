# Desarrollo:  docker compose up --build   ->  http://localhost:8000/api/
# La primera vez copia Krazz.sqlite3 (datos de ejemplo del repo) a un volumen, así tus
# pruebas no ensucian git. Para empezar de cero:  docker compose down -v
# Para usar PostgreSQL o MySQL define DATABASE_URL en .env.
services:
  api:
    build: .
    container_name: krazz-api
    command: >
      sh -c "mkdir -p /data &&
             ( [ -f /data/Krazz.sqlite3 ] || cp Krazz.sqlite3 /data/Krazz.sqlite3 ) &&
             python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo-cambiala}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/Krazz.sqlite3}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - .:/app
      - krazz_data:/data
    restart: unless-stopped

volumes:
  krazz_data:
